<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap');

  :root{
    --bg: #ffffff;
    --panel: #ffffff;
    --panel-border: #e0e2e7;
    --heading: #0b0f14;
    --body: #151c25;
    --ink-dim: #676d77;
    --placeholder: #aeb2b7;
    --amber: #5068d4;
    --amber-hover: #435298;
    --amber-tint: #f2f3fc;
    --danger: #eb0000;

    --status-done-bg: #eafaf1;
    --status-done-fg: #1b8a5a;
    --status-done-border: #bee8d2;
    --status-action-bg: #fff6e8;
    --status-action-fg: #b8720a;
    --status-action-border: #f3dfb3;

    --status-precall-bg: #eef1fc;
    --status-precall-fg: #5068d4;
    --status-precall-border: #c7d0f5;
  }

  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--body);
    font-family: 'DM Sans', sans-serif;
    padding: 0 0 80px;
  }

  .site-header{
    position: sticky;
    top: 0;
    z-index: 100;
    background: #ffffff;
    border-bottom: 1px solid var(--panel-border);
  }
  .site-header-inner{
    max-width: 720px;
    margin: 0 auto;
    padding: 16px;
    display: flex;
    justify-content: center;
  }

  .wrap{ max-width: 720px; margin: 0 auto; padding: 48px 16px 0; }

  .header{ margin-bottom: 32px; }
  .eyebrow{
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-size: 13px;
    color: var(--amber);
  }
  h1{
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: clamp(30px, 5.5vw, 40px);
    line-height: 1.15;
    margin: 14px 0 10px;
    letter-spacing: -0.01em;
    color: var(--heading);
  }
  .sub{ color: var(--ink-dim); font-size: 15px; line-height: 1.5; max-width: none; font-weight: 400; }

  .status-chip-row{ display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; }
  .status-chip{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 16px;
    border-radius:100px;
    font-family: 'DM Sans', sans-serif;
    font-weight:600;
    font-size:13.5px;
  }
  .status-chip.chip-done{ background: var(--status-done-bg); color: var(--status-done-fg); }
  .status-chip.chip-action{ background: var(--status-action-bg); color: var(--status-action-fg); }
  .status-chip.chip-precall{ background: var(--status-precall-bg); color: var(--status-precall-fg); }
  .status-chip .dot{
    width:6px;height:6px;border-radius:50%;
    background: currentColor;
  }

  .card{
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 16px;
    transition: border-color .15s ease;
  }
  .card[open]{ border-color: var(--amber); }
  .card summary{
    list-style: none;
    cursor: pointer;
    padding: 24px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .card summary::-webkit-details-marker{ display:none; }

  .card-content{
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .chev{
    width: 18px; height: 18px;
    flex: 0 0 auto;
    color: var(--ink-dim);
    transition: transform .15s ease;
  }
  .card[open] .chev{ transform: rotate(90deg); color: var(--amber); }

  .card-title-block{ flex:1; min-width:0; }
  .card-title{
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 20px;
    line-height: 1.2;
    margin: 0 0 2px;
    color: var(--heading);
    letter-spacing: -0.005em;
  }
  .card-meta{ font-size: 13px; color: var(--ink-dim); font-weight: 400; }

  .badge{
    flex: 0 0 auto;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 11.5px;
    padding: 5px 10px;
    border-radius: 100px;
    white-space: nowrap;
  }
  .badge.done{ background: var(--status-done-bg); color: var(--status-done-fg); }
  .badge.action{ background: var(--status-action-bg); color: var(--status-action-fg); }
  .badge.precall{ background: var(--status-precall-bg); color: var(--status-precall-fg); }
  .badge.skip{ background: #f1f1f5; color: #676d77; }

  .card-body{ padding: 0 24px 24px; border-top: 1px solid var(--panel-border); }
  .card-body-inner{ padding-top: 20px; }

  .field{ margin-bottom: 28px; }
  .field:last-of-type{ margin-bottom: 0; }
  .field-label{
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 16px;
    line-height: 1.3;
    color: var(--heading);
    margin-bottom: 8px;
    letter-spacing: -0.003em;
  }
  .field-text{
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    font-size: 14px;
    line-height: 1.6;
    color: var(--body);
  }
  .field-text a{ color: var(--amber); text-decoration: none; border-bottom: 1.5px solid var(--amber); }
  .field-text a:hover{ color: var(--amber-hover); border-bottom-color: var(--amber-hover); }

  .info-box{
    background: var(--status-done-bg);
    border: 1px solid var(--status-done-border);
    border-radius: 10px;
    padding: 14px 16px;
    margin: 16px 0;
  }
  .info-box .field-label{
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    line-height: 1.4;
    color: var(--status-done-fg);
    margin-bottom: 6px;
  }
  .info-box .field-text{ color: #125c3b; font-size: 14.5px; line-height: 1.6; }

  .precall-box{
    background: #ffffff;
    border: 1px solid var(--status-precall-border);
    border-radius: 10px;
    padding: 14px 16px;
    margin: 16px 0;
  }
  .precall-box .field-label{
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    line-height: 1.4;
    color: var(--status-precall-fg);
    margin-bottom: 6px;
  }
  .precall-box .field-text{ color: var(--body); font-size: 14.5px; line-height: 1.6; }

  .skip-box{
    background: #f7f7f9;
    border: 1px solid #e3e4e9;
    border-radius: 10px;
    padding: 14px 16px;
    margin: 16px 0;
  }
  .skip-box .field-label{
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    line-height: 1.4;
    color: #676d77;
    margin-bottom: 6px;
  }
  .skip-box .field-text{ color: var(--body); font-size: 14.5px; line-height: 1.6; }

  .action-box{
    background: #ffffff;
    border: 1px solid var(--status-action-border);
    border-radius: 10px;
    padding: 14px 16px;
    margin: 16px 0;
  }
  .action-box .field-label{
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    line-height: 1.4;
    color: var(--status-action-fg);
    margin-bottom: 6px;
  }
  .action-box .field-text{ color: var(--body); font-size: 14.5px; line-height: 1.6; }
  .action-box.highlight{
    border-color: var(--status-action-fg);
    box-shadow: 0 0 0 3px rgba(184,114,10,0.12);
  }

  .btn{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 10px 16px;
    border-radius: 9px;
    text-decoration: none;
    margin-top: 10px;
  }
  .btn.primary{ background: var(--amber); color: #ffffff; }
  .btn.primary:hover{ background: var(--amber-hover); }
  .btn.secondary{ background: #ffffff; color: var(--amber); border: 1.5px solid var(--amber); }
  .btn.secondary:hover{ background: var(--amber-tint); }
  .btn-small{ padding: 7px 14px; font-size: 12.5px; }
  .btn:disabled{ opacity: 0.4; cursor: not-allowed; pointer-events: none; }

  .step-list{ display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
  .step-list-item{ display: flex; align-items: center; gap: 12px; }
  .step-list-num{
    flex: 0 0 auto;
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1.5px solid var(--status-action-fg);
    color: var(--status-action-fg);
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 12px;
    display: flex; align-items: center; justify-content: center;
  }

  .divider{ height: 1px; background: var(--panel-border); margin: 24px 0 20px; }

  .response-header{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;
  }
  .response-header .response-title{
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 15px;
    color: var(--amber);
    letter-spacing: -0.005em;
  }
  .clear-response{
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 12.5px;
    color: var(--ink-dim);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 2px;
    background: none;
    border: none;
    padding: 0;
  }
  .clear-response:hover{ color: var(--amber); }

  .response-row{ display:flex; gap:10px; flex-wrap:wrap; }
  .choice{
    flex: 1;
    min-width: 140px;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
    padding: 11px 14px;
    border-radius: 9px;
    border: 1.5px solid var(--panel-border);
    background: #ffffff;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    font-size: 13.5px;
    color: var(--ink-dim);
    transition: all .15s ease;
    user-select: none;
  }
  .choice:hover{ border-color: var(--amber); }
  .active-done{ background: var(--status-done-bg); border-color: var(--status-done-fg); color: var(--status-done-fg); }
  .active-action{ background: var(--status-action-bg); border-color: var(--status-action-fg); color: var(--status-action-fg); }
  .active-precall{ background: var(--status-precall-bg); border-color: var(--status-precall-fg); color: var(--status-precall-fg); }
  .active-skip{ background: #f1f1f5; border-color: #8a8d9c; color: #5b5f72; }

  .notes-block{ margin-top: 16px; }
  .notes-textarea{
    width: 100%;
    min-height: 64px;
    resize: vertical;
    border: 1.5px solid var(--panel-border);
    border-radius: 9px;
    padding: 10px 12px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13.5px;
    line-height: 1.5;
    color: var(--body);
    background: #ffffff;
  }
  .notes-textarea:focus{ outline: none; border-color: var(--amber); }
  .notes-textarea::placeholder{ color: var(--placeholder); }
  .notes-footer{
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-top: 6px;
  }
  .notes-status{ font-size: 12px; color: var(--placeholder); }

  footer{
    margin-top: 40px;
    padding-top: 20px;
    border-top: 1px solid var(--panel-border);
    font-size: 12.5px;
    color: var(--ink-dim);
    text-align: center;
  }

  .status-select{
    width: 100%;
    padding: 11px 14px;
    border: 1.5px solid var(--panel-border);
    border-radius: 9px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13.5px;
    color: var(--body);
    background: #ffffff;
    cursor: pointer;
    margin-bottom: 4px;
  }
  .status-select:focus{ outline: none; border-color: var(--amber); }

  .schedule-row{ margin-top: 8px; margin-bottom: 4px; }
  .schedule-label{
    display: block;
    font-family: 'DM Sans', sans-serif;
    font-size: 12px;
    font-weight: 600;
    color: var(--ink-dim);
    margin-bottom: 5px;
  }
  .schedule-input{
    width: 100%;
    padding: 10px 14px;
    border: 1.5px solid var(--panel-border);
    border-radius: 9px;
    font-family: 'DM Sans', sans-serif;
    font-size: 13.5px;
    color: var(--body);
    background: #ffffff;
  }
  .schedule-input:focus{ outline: none; border-color: var(--amber); }

  .delete-row{
    display: flex;
    justify-content: flex-end;
    margin-top: 24px;
  }
  .delete-btn{
    display: inline-flex;
    align-items: center;
    gap: 7px;
    padding: 8px 14px;
    border-radius: 8px;
    border: 1.5px solid var(--panel-border);
    background: #ffffff;
    color: var(--ink-dim);
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 13px;
  }
  .delete-btn:hover{ border-color: var(--danger); color: var(--danger); background: #fff5f5; }

  .timeline{ margin-top: 4px; }
  .timeline-item{
    position: relative;
    padding-left: 22px;
    padding-bottom: 16px;
  }
  .timeline-item:last-child{ padding-bottom: 0; }
  .timeline-item::before{
    content: "";
    position: absolute;
    left: 4px; top: 4px;
    width: 9px; height: 9px;
    border-radius: 50%;
    background: var(--status-action-fg);
  }
  .timeline-item::after{
    content: "";
    position: absolute;
    left: 8px; top: 15px; bottom: -2px;
    width: 1.5px;
    background: var(--panel-border);
  }
  .timeline-item:last-child::after{ display: none; }
  .timeline-item.cls-done::before{ background: var(--status-done-fg); }
  .timeline-item.cls-precall::before{ background: var(--status-precall-fg); }
  .timeline-item.cls-skip::before{ background: #8a8d9c; }
  .timeline-label{
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 13.5px;
    color: var(--body);
  }
  .timeline-date{ font-size: 12px; color: var(--ink-dim); margin-top: 2px; }

  @media (max-width: 640px){
    .card-content{
      flex-direction: column;
      align-items: flex-start;
      gap: 8px;
    }
    .card-title-block{ width: 100%; }
    .badge{ align-self: flex-start; }
  }

  @media (max-width: 480px){
    .wrap{ padding: 32px 16px 0; }
  }

<script>
const SUPABASE_URL = "https://huogkifyzaybppnhzayc.supabase.co";
const SUPABASE_KEY = "sb_publishable_IR37FVvE-vcguWs9RgATuw_WkvpUSu3";
const FORMSPREE_ENDPOINT = "https://formspree.io/f/myegvkqd";

const responses = {};      // podcast_id -> current status value
const notesText = {};      // podcast_id -> notes string
const deletedFlags = {};   // podcast_id -> boolean (removed from the list)
const statusHistory = {};  // podcast_id -> [{status, changed_at}, ...]
const scheduledDates = {}; // podcast_id -> ISO datetime string or null (recording date/time)

async function fetchAllRows(){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/cahill_podcast_responses?select=podcast_id,response,notes,deleted,scheduled_at`, {
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
  });
  if (!res.ok) throw new Error("fetch failed: " + res.status);
  return res.json();
}

async function fetchAllHistory(){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/cahill_status_log?select=podcast_id,status,changed_at&order=changed_at.asc`, {
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
  });
  if (!res.ok) throw new Error("fetch failed: " + res.status);
  return res.json();
}

function describeResponseValue(value){
  if (!value) return "(not set)";
  const opt = STATUS_OPTIONS.find(o => o.value === value);
  return opt ? opt.label : value;
}

async function notifyByEmail(podcastId, subjectSuffix, updateText){
  const podcast = PODCASTS.find(p => p.id === podcastId);
  const podcastName = podcast ? podcast.name : podcastId;
  try {
    await fetch(FORMSPREE_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({
        _subject: `Podcast pipeline ${subjectSuffix}: ${podcastName}`,
        podcast: podcastName,
        update: updateText
      })
    });
  } catch (e) {
    console.error("email notify failed", e);
  }
}

// Always writes the full known row (response + notes + deleted + scheduled_at) so a
// partial update never silently wipes out another field via Supabase's upsert behavior.
async function saveRow(id){
  const response = responses[id] ?? null;
  const notes = notesText[id] ?? null;
  const deleted = !!deletedFlags[id];
  const scheduled_at = scheduledDates[id] ?? null;
  await fetch(`${SUPABASE_URL}/rest/v1/cahill_podcast_responses`, {
    method: "POST",
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json",
      Prefer: "resolution=merge-duplicates"
    },
    body: JSON.stringify([{ podcast_id: id, response, notes, deleted, scheduled_at, updated_at: new Date().toISOString() }])
  });
}

async function logStatusChange(id, status){
  await fetch(`${SUPABASE_URL}/rest/v1/cahill_status_log`, {
    method: "POST",
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify([{ podcast_id: id, status }])
  });
}

async function saveResponse(id, value){
  responses[id] = value;
  await saveRow(id);
  if (value) await logStatusChange(id, value);
  notifyByEmail(id, "status update", describeResponseValue(value));
}

async function saveNotes(id, text){
  const trimmed = (text || "").trim();
  notesText[id] = trimmed || null;
  await saveRow(id);
  notifyByEmail(id, trimmed ? "note updated" : "note cleared", trimmed || "(note cleared)");
}

// Each podcast's current status lives in Supabase (see STATUS_OPTIONS below);
// this array only holds the static reference info shown in the card.
const PODCASTS = [
  {
    id: "marketing-in-progress",
    name: "Marketing in Progress",
    host: "Gayle Kalvert · CEO, Creo Collective",
    niche: "Marketing & growth leaders — CMO/operator scaling stories",
    fields: [
      { label: "Timeline", text: "✓ We pitched Gayle directly&nbsp;&nbsp;→&nbsp;&nbsp;✓ Creo Collective confirmed they want to move forward&nbsp;&nbsp;→&nbsp;&nbsp;✓ Producer Patrice reached out&nbsp;&nbsp;→&nbsp;&nbsp;✓ Recording booked" },

      { label: "Podcast", text: "<a href=\"https://open.spotify.com/show/0IXJd3NPWHwZM1hZuIyBqv\" target=\"_blank\">Spotify</a> · <a href=\"https://podcasts.apple.com/us/podcast/david-c-barnett-small-business-and-deal-making-m-a-smb/id1234025671\" target=\"_blank\">Apple Podcasts</a>" },
      { label: "About the host", text: "David C Barnett — has started, bought, sold, and closed businesses himself. Author of several best-selling business books, including \"Invest Local,\" \"Franchise Warnings,\" and \"How To Sell My Own Business.\" 400+ episodes, mostly short and to the point, on buying/selling/financing/managing SMBs." },
      { label: "Who replied", text: "Erica Parinas, Advantage Liquidity Partners (eparinas@alpatlantic.com) — screening guest submissions on the show's behalf." },
      { label: "What Erica said", text: "Audience is focused on SMB owners buying, selling, and exiting businesses. She explicitly flagged: \"At this time, we are not interested in crypto-related topics.\" She asked for a short explanation of how the guest aligns with their audience and niche as part of the submission." },
      { label: "NOTE", text: "Keep the submission generic on industry specifics (\"two tech companies\") and centered on the M&A mechanics and GTM/exit-side experience — there's no need to name the companies or their industry, since it isn't relevant to the fit case being made and their stated focus is deal-making mechanics, not any particular sector." },
      { label: "Why you're a fit", text: "Cahill led GTM strategy and the exit process behind two 8-figure acquisitions ($38M and $14M) as CMO and Operations Advisor — hands-on experience with what drives a deal from the operator's side, not just the finance side. He's also worked with a wide range of SMB owners on growth and exit-readiness through his agency, Digital Vision Media Group." }
    ],
    action: "Submit the guest form with a short explanation of fit — keep it centered on M&A mechanics and operator-side exit experience.",
    link: { url: "https://forms.clickup.com/90132967314/f/2ky5fvwj-2033/W65FXVGIV4E9X1UX7E", label: "Fill out the guest submission form" }
  }
];

// Ordered progression of statuses you can mark on a podcast. `cls` reuses the
// existing done/action/precall/skip badge colors.
const STATUS_OPTIONS = [
  { value: "replied_to_host", label: "Replied to host", cls: "precall" },
  { value: "waiting_reply", label: "Waiting on reply", cls: "precall" },
  { value: "host_replied_need_response", label: "Host replied, need to respond", cls: "action" },
  { value: "need_form", label: "Need to fill out form", cls: "action" },
  { value: "form_filled", label: "Form filled out", cls: "precall" },
  { value: "need_precall", label: "Need to book pre-call", cls: "action" },
  { value: "precall_booked", label: "Pre-call booked", cls: "precall" },
  { value: "recording_booked", label: "Recording booked", cls: "done" },
  { value: "episode_recorded", label: "Episode recorded", cls: "done" }
];

const BOX_CLASS_BY_CLS = { done: "info-box", action: "action-box", precall: "precall-box", skip: "skip-box" };

// Sort tier: 0 = needs a first action (nothing started, or a form/pre-call to
// book), 1 = in process (waiting on someone), 2 = pre-call booked, 3 = done.
// Unset status defaults to tier 0 since it also needs a first action.
const STATUS_PRIORITY = {
  need_form: 0, need_precall: 0,
  waiting_reply: 1, replied_to_host: 1, host_replied_need_response: 1, form_filled: 1,
  precall_booked: 2,
  recording_booked: 3,
  episode_recorded: 4
};

function lastChangedTime(id){
  const hist = statusHistory[id];
  if (!hist || !hist.length) return Date.now(); // never touched yet — treat as freshest
  return new Date(hist[hist.length - 1].changed_at).getTime();
}

const list = document.getElementById("list");

function fieldHTML(f){
  return `<div class="field">
    <div class="field-label">${f.label}</div>
    <div class="field-text">${f.text}</div>
  </div>`;
}

function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString("en-US", { day: "numeric", month: "short", year: "numeric" });
}

function fmtDateTime(iso){
  const d = new Date(iso);
  const datePart = d.toLocaleDateString("en-US", { day: "numeric", month: "short", year: "numeric" });
  const timePart = d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
  return `${datePart}, ${timePart}`;
}

// Converts an ISO datetime string to the value a <input type="datetime-local">
// expects (local time, no seconds/timezone), or "" if none set.
function isoToLocalInputValue(iso){
  if (!iso) return "";
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
}

const openCards = new Set();

function render(){
  list.innerHTML = "";
  const visiblePodcasts = PODCASTS.filter(p => !deletedFlags[p.id]);
  visiblePodcasts.sort((a, b) => {
    const pa = STATUS_PRIORITY[responses[a.id]] ?? 0;
    const pb = STATUS_PRIORITY[responses[b.id]] ?? 0;
    if (pa !== pb) return pa - pb;
    return lastChangedTime(b.id) - lastChangedTime(a.id); // freshest first within a tier
  });

  visiblePodcasts.forEach((p, idx) => {
    const resp = responses[p.id] || null;
    const statusMeta = STATUS_OPTIONS.find(o => o.value === resp) || null;
    const badgeCls = statusMeta ? statusMeta.cls : "skip";
    const scheduledAt = scheduledDates[p.id] || null;
    const showsSchedule = resp === "recording_booked" || resp === "episode_recorded";
    const badgeLabel = statusMeta
      ? (showsSchedule && scheduledAt ? `${statusMeta.label} · ${fmtDateTime(scheduledAt)}` : statusMeta.label)
      : "Not set";

    const card = document.createElement("details");
    card.className = "card";
    card.dataset.id = p.id;
    if (openCards.has(p.id)) card.open = true;
    card.addEventListener("toggle", () => {
      if (card.open) openCards.add(p.id); else openCards.delete(p.id);
    });

    const boxClass = BOX_CLASS_BY_CLS[badgeCls] || "action-box";

    const linkHTML = p.link ? `<a class="btn primary" href="${p.link.url}" target="_blank">${p.link.label} →</a>` : "";

    const history = (statusHistory[p.id] || []).slice().reverse();
    const timelineHTML = history.length ? `
      <div class="divider"></div>
      <div class="response-header"><span class="response-title">Timeline</span></div>
      <div class="timeline">
        ${history.map(h => {
          const meta = STATUS_OPTIONS.find(o => o.value === h.status);
          return `<div class="timeline-item cls-${meta ? meta.cls : 'skip'}">
            <div class="timeline-label">${meta ? meta.label : h.status}</div>
            <div class="timeline-date">${fmtDate(h.changed_at)}</div>
          </div>`;
        }).join("")}
      </div>` : "";

    const existingNote = notesText[p.id] || "";
    const notesHTML = `
      <div class="divider"></div>
      <div class="response-header">
        <span class="response-title">Notes</span>
        ${existingNote ? `<button type="button" class="clear-response" data-clear-note-id="${p.id}">Delete</button>` : ""}
      </div>
      <div class="notes-block">
        <textarea class="notes-textarea" data-notes-id="${p.id}" placeholder="Add a note for the team (optional)...">${existingNote}</textarea>
        <div class="notes-footer">
          <button type="button" class="btn secondary btn-small" data-save-note-id="${p.id}" style="margin-top:0;" ${existingNote.trim() ? "" : "disabled"}>Save note</button>
          <span class="notes-status" data-notes-status="${p.id}"></span>
        </div>
      </div>`;

    card.innerHTML = `
      <summary>
        <div class="card-content">
          <div class="card-title-block">
            <p class="card-title">${idx+1}. ${p.name}</p>
            <p class="card-meta">${p.host}</p>
          </div>
          <span class="badge ${badgeCls}">${badgeLabel}</span>
        </div>
        <svg class="chev" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </summary>
      <div class="card-body">
        <div class="card-body-inner">
          ${fieldHTML({label:"Niche", text:p.niche})}
          ${p.fields.map(fieldHTML).join("")}
          <div class="${boxClass}">
            <div class="field-label">Context</div>
            <div class="field-text">${p.action}</div>
            ${linkHTML}
          </div>
          <div class="divider"></div>
          <div class="response-header"><span class="response-title">Status</span></div>
          <select class="status-select" data-status-id="${p.id}">
            <option value="" ${!resp ? "selected" : ""}>— select a status —</option>
            ${STATUS_OPTIONS.map(o => `<option value="${o.value}" ${resp===o.value ? "selected" : ""}>${o.label}</option>`).join("")}
          </select>
          ${showsSchedule ? `
          <div class="schedule-row">
            <label class="schedule-label" for="schedule-${p.id}">Recording date &amp; time</label>
            <input type="datetime-local" id="schedule-${p.id}" class="schedule-input" data-schedule-id="${p.id}" value="${isoToLocalInputValue(scheduledAt)}" />
          </div>` : ""}
          ${timelineHTML}
          ${notesHTML}
          <div class="delete-row">
            <button type="button" class="delete-btn" data-delete-id="${p.id}" title="Remove from list">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span>Delete podcast</span>
            </button>
          </div>
        </div>
      </div>
    `;
    list.appendChild(card);
  });

  document.querySelectorAll(".status-select").forEach(el => {
    el.addEventListener("click", (e) => e.stopPropagation());
    el.addEventListener("change", async (e) => {
      e.stopPropagation();
      const id = el.dataset.statusId;
      const val = el.value || null;
      responses[id] = val;
      if (val) {
        if (!statusHistory[id]) statusHistory[id] = [];
        statusHistory[id].push({ status: val, changed_at: new Date().toISOString() });
      }
      render();
      updateStatusChip();
      try { await saveResponse(id, val); } catch (err) { console.error("save error", err); }
    });
  });

  document.querySelectorAll(".schedule-input").forEach(el => {
    el.addEventListener("click", (e) => e.stopPropagation());
    el.addEventListener("change", async (e) => {
      e.stopPropagation();
      const id = el.dataset.scheduleId;
      // datetime-local gives local time with no timezone; store as an ISO string.
      const localVal = el.value; // "YYYY-MM-DDTHH:MM"
      scheduledDates[id] = localVal ? new Date(localVal).toISOString() : null;
      render();
      try { await saveRow(id); } catch (err) { console.error("save error", err); }
    });
  });

  document.querySelectorAll("[data-delete-id]").forEach(el => {
    el.addEventListener("click", async (e) => {
      e.preventDefault();
      e.stopPropagation();
      const id = el.dataset.deleteId;
      const podcast = PODCASTS.find(p => p.id === id);
      const ok = window.confirm(`Remove "${podcast ? podcast.name : id}" from the list? This can only be undone manually in the database.`);
      if (!ok) return;
      deletedFlags[id] = true;
      render();
      updateStatusChip();
      try { await saveRow(id); } catch (err) { console.error("delete error", err); }
    });
  });

  document.querySelectorAll(".clear-response[data-clear-note-id]").forEach(el => {
    el.addEventListener("click", async (e) => {
      e.preventDefault();
      e.stopPropagation();
      const id = el.dataset.clearNoteId;
      notesText[id] = null;
      render();
      try { await saveNotes(id, ""); } catch (err) { console.error("save error", err); }
    });
  });

  async function persistNote(id, value, statusEl){
    const previous = notesText[id] || "";
    if (value.trim() === previous.trim()) return;
    if (statusEl) statusEl.textContent = "Saving…";
    notesText[id] = value.trim() || null;
    try {
      await saveNotes(id, value);
      render();
      const freshStatusEl = document.querySelector(`[data-notes-status="${id}"]`);
      if (freshStatusEl) {
        freshStatusEl.textContent = "Saved";
        setTimeout(() => { freshStatusEl.textContent = ""; }, 1500);
      }
    } catch (err) {
      console.error("save error", err);
      if (statusEl) statusEl.textContent = "Failed to save";
    }
  }

  document.querySelectorAll(".notes-textarea").forEach(el => {
    el.addEventListener("click", (e) => e.stopPropagation());
    el.addEventListener("input", () => {
      const id = el.dataset.notesId;
      const saveBtn = document.querySelector(`[data-save-note-id="${id}"]`);
      if (saveBtn) saveBtn.disabled = el.value.trim().length === 0;
    });
    el.addEventListener("blur", () => {
      const id = el.dataset.notesId;
      const statusEl = document.querySelector(`[data-notes-status="${id}"]`);
      persistNote(id, el.value, statusEl);
    });
  });

  document.querySelectorAll("[data-save-note-id]").forEach(el => {
    el.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      const id = el.dataset.saveNoteId;
      const textarea = document.querySelector(`.notes-textarea[data-notes-id="${id}"]`);
      const statusEl = document.querySelector(`[data-notes-status="${id}"]`);
      if (textarea) persistNote(id, textarea.value, statusEl);
    });
  });
}

function updateStatusChip(){
  let recorded = 0, booked = 0, waiting = 0, action = 0;
  PODCASTS.forEach(p => {
    if (deletedFlags[p.id]) return;
    const r = responses[p.id];
    if (r === "episode_recorded") recorded++;
    else if (r === "recording_booked") booked++;
    else {
      const meta = STATUS_OPTIONS.find(o => o.value === r);
      if (meta && meta.cls === "precall") waiting++;
      else action++; // covers explicit "action" cls and unset/no status yet
    }
  });
  document.getElementById("statusChipRecorded").textContent = `${recorded} Episode recorded`;
  document.getElementById("statusChipBooked").textContent = `${booked} Recording booked`;
  document.getElementById("statusChipPrecall").textContent = `${waiting} Waiting on reply`;
  document.getElementById("statusChipPending").textContent = `${action} Need action`;
}

// Collapse an open card on any click that isn't on its own summary (header) —
// this covers clicks fully outside the card, AND clicks inside the open card's
// body away from the header, so people don't have to scroll back up to close it.
// Clicks on interactive controls (status select, notes, save/clear buttons)
// already call stopPropagation in their own handlers, so they never reach here.
// Also skip closing if the click is the tail end of selecting text (e.g. to
// copy a field), so selecting text inside a card doesn't collapse it.
document.addEventListener("click", (e) => {
  const selection = window.getSelection();
  if (selection && selection.toString().length > 0) return;
  document.querySelectorAll(".card[open]").forEach(card => {
    const summary = card.querySelector(":scope > summary");
    if (summary && summary.contains(e.target)) return; // let native summary toggle handle itself
    card.open = false;
    if (card.dataset.id) openCards.delete(card.dataset.id);
  });
});

async function loadResponses(){
  try {
    const rows = await fetchAllRows();
    rows.forEach(row => {
      responses[row.podcast_id] = row.response;
      notesText[row.podcast_id] = row.notes;
      deletedFlags[row.podcast_id] = !!row.deleted;
      scheduledDates[row.podcast_id] = row.scheduled_at || null;
    });
    const historyRows = await fetchAllHistory();
    historyRows.forEach(row => {
      if (!statusHistory[row.podcast_id]) statusHistory[row.podcast_id] = [];
      statusHistory[row.podcast_id].push({ status: row.status, changed_at: row.changed_at });
    });
  } catch (e) {
    console.error("load error", e);
  }
  render();
  updateStatusChip();
}

loadResponses();
</script>
