<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap');

  :root{
    --bg: #ffffff;
    --panel: #ffffff;
    --panel-border: #e0e2e7;
    --heading: #0b0f14;
    --body: #151c25;
    --ink-dim: #676d77;
    --placeholder: #aeb2b7;
    --amber: #5068d4;
    --amber-hover: #435298;
    --amber-tint: #f2f3fc;
    --danger: #eb0000;

    --status-done-bg: #eafaf1;
    --status-done-fg: #1b8a5a;
    --status-done-border: #bee8d2;
    --status-action-bg: #fff6e8;
    --status-action-fg: #b8720a;
    --status-action-border: #f3dfb3;

    --status-precall-bg: #eef1fc;
    --status-precall-fg: #5068d4;
    --status-precall-border: #c7d0f5;

    --status-prebooked-bg: #e8f1fe;
    --status-prebooked-fg: #1f6fd6;
    --status-prebooked-border: #b9d7f9;
  }

  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: #f7f7f8;
    color: var(--body);
    font-family: 'DM Sans', sans-serif;
    padding: 24px;
  }

  .shell{
    max-width: 1400px;
    margin: 0 auto;
    background: #ffffff;
    border: 1px solid #d3d9f6;
    border-radius: 12px;
    overflow: visible;
  }
  .shell-topbar{
    border-top-left-radius: 12px;
    border-top-right-radius: 12px;
    display: flex;
    align-items: stretch;
    justify-content: space-between;
    gap: 16px;
    padding: 0 12px;
    border-bottom: 1px solid #d3d9f6;
    flex-wrap: wrap;
  }
  .shell-tabs{ display: flex; align-items: stretch; gap: 2px; }
  .shell-tab{
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 16px;
    line-height: 21px;
    color: #424239;
    padding: 12px 8px;
    text-decoration: none;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
    display: flex;
    align-items: center;
  }
  .shell-tab.active{ color: var(--amber); border-bottom-color: var(--amber); }
  .shell-search{
    box-sizing: border-box;
    display: flex;
    align-items: center;
    gap: 8px;
    width: 240px;
    height: 32px;
    padding: 8px 16px;
    border: 1px solid var(--panel-border);
    border-radius: 8px;
    margin: 6px 0;
  }
  .shell-search svg{ width: 16px; height: 16px; color: var(--ink-dim); flex: 0 0 auto; }
  .shell-search input{
    border: none;
    outline: none;
    font-family: 'DM Sans', sans-serif;
    font-size: 14px;
    line-height: 16px;
    color: var(--body);
    width: 100%;
    background: transparent;
    padding: 0;
  }
  .shell-search input::placeholder{ color: var(--ink-dim); }

  .page-layout{
    display: flex;
    align-items: flex-start;
    gap: 24px;
    padding: 16px;
  }
  .wrap{
    flex: 3 1 0;
    min-width: 0;
    margin: 0;
    padding: 0;
    background: transparent;
    border: none;
    border-radius: 0;
    box-shadow: none;
  }

  .sidebar{
    flex: 1 1 0;
    min-width: 280px;
    max-width: 360px;
    position: sticky;
    top: 24px;
    margin-top: 0;
    background: #ffffff;
    border: 1px solid rgba(83,74,183,0.08);
    border-radius: 12px;
    box-shadow: none;
    padding: 12px;
    max-height: calc(100vh - 48px);
    overflow-y: auto;
    scrollbar-width: none;
  }
  .sidebar:hover, .sidebar.is-scrolling{
    scrollbar-width: thin;
    scrollbar-color: rgba(0,0,0,0.18) transparent;
  }
  .sidebar::-webkit-scrollbar{ width: 4px; }
  .sidebar::-webkit-scrollbar-track{ background: transparent; }
  .sidebar::-webkit-scrollbar-thumb{ background: transparent; border-radius: 4px; }
  .sidebar:hover::-webkit-scrollbar-thumb,
  .sidebar.is-scrolling::-webkit-scrollbar-thumb{ background: rgba(0,0,0,0.18); }
  .sidebar-header{
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 20px;
    color: var(--heading);
    letter-spacing: -0.01em;
    margin-bottom: 4px;
  }
  .sidebar-today-date{
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    font-size: 14px;
    color: var(--amber);
    margin-bottom: 18px;
  }
  .sidebar-empty{
    font-family: 'DM Sans', sans-serif;
    font-size: 13px;
    color: var(--ink-dim);
    padding: 4px 0;
  }
  .sidebar-date-group{ margin-bottom: 16px; }
  .sidebar-date-group:last-child{ margin-bottom: 0; }
  .sidebar-date-label{
    font-family: 'DM Sans', sans-serif;
    font-weight: 500;
    font-size: 12.5px;
    color: var(--ink-dim);
    text-transform: uppercase;
    letter-spacing: 0.03em;
    margin-bottom: 8px;
    padding-bottom: 6px;
    border-bottom: 1px solid var(--panel-border);
  }
  .sidebar-event{
    display: block;
    width: 100%;
    text-align: left;
    background: #ffffff;
    border: 1px solid var(--panel-border);
    border-radius: 9px;
    padding: 9px 12px;
    margin-bottom: 6px;
    cursor: pointer;
    font-family: 'DM Sans', sans-serif;
  }
  .sidebar-event:last-child{ margin-bottom: 0; }
  .sidebar-event:hover{ background: var(--amber-tint); }
  .sidebar-event.cls-precall{ border-color: var(--status-precall-fg); }
  .sidebar-event.cls-prebooked{ border-color: var(--status-prebooked-fg); }
  .sidebar-event.cls-done{ border-color: var(--status-done-fg); }
  .sidebar-event-title{
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 14px;
    margin-bottom: 2px;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .sidebar-event.cls-precall .sidebar-event-title,
  .sidebar-event.cls-precall .sidebar-event-meta{ color: var(--status-precall-fg); }
  .sidebar-event.cls-prebooked .sidebar-event-title,
  .sidebar-event.cls-prebooked .sidebar-event-meta{ color: var(--status-prebooked-fg); }
  .sidebar-event.cls-done .sidebar-event-title,
  .sidebar-event.cls-done .sidebar-event-meta{ color: var(--status-done-fg); }
  .sidebar-event-meta{
    font-size: 11.5px;
    font-weight: 400;
  }
  .sidebar-event-details{
    font-size: 10.5px;
    font-weight: 400;
    margin-top: 4px;
  }
  .sidebar-event-details.sent{ color: var(--status-done-fg); }
  .sidebar-event-details.not-sent{ color: var(--status-action-fg); }

  @media (max-width: 980px){
    .page-layout{ flex-direction: column; padding: 0 16px; }
    .wrap{ max-width: none; width: 100%; }
    .sidebar{
      width: 100%;
      max-width: none;
      flex: 1 1 auto;
      position: static;
      margin-top: 0;
      max-height: none;
    }
  }

  .header{ margin-bottom: 32px; }
  .eyebrow{
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-size: 13px;
    color: var(--amber);
  }
  h1{
    font-family: 'Inter', sans-serif;
    font-weight: 500;
    font-size: 20px;
    line-height: 1.25;
    margin: 0 0 10px;
    letter-spacing: -0.01em;
    color: var(--heading);
  }
  .sub{ color: var(--ink-dim); font-size: 15px; line-height: 1.5; max-width: none; font-weight: 400; }

  .status-chip-row{ display:flex; gap:24px; margin-top:20px; flex-wrap:wrap; align-items:center; }
  .status-chip{
    display:inline-flex;
    align-items:center;
    gap:4px;
    padding:0;
    border-radius:8px;
    font-family: 'DM Sans', sans-serif;
    font-weight:400;
    font-size:14px;
    border: none;
    background: transparent;
    cursor: pointer;
    appearance: none;
    -webkit-appearance: none;
    outline: none;
  }
  .status-chip.chip-all{
    gap: 8px;
    border: 1px solid #8e9195;
    border-radius: 8px;
    background: transparent;
    color: var(--heading);
    font-weight: 400;
    padding: 4px 12px;
  }
  .status-chip.active.chip-all{ border-color: var(--heading); }
  .status-chip:hover:not(.chip-all){ background: #f7f7f8; }
  .status-chip.chip-done{ color: #0c8f21; }
  .status-chip.chip-recording-booked{ color: #007aff; }
  .status-chip.chip-action{ color: #9e610c; }
  .status-chip.chip-precall{ color: #5068d4; }
  .status-chip .dot{
    width:6px;height:6px;border-radius:50%;
    background: currentColor;
  }

  .list{
    background: #f7f7f7;
    border-radius: 12px;
    padding: 12px 0;
  }
  .card{
    background: transparent;
    border: none;
    border-bottom: 1px solid #d3d9f6;
    border-radius: 0;
    overflow: hidden;
    padding-bottom: 12px;
    margin-bottom: 12px;
    transition: background-color .15s ease;
  }
  .card:last-of-type{ border-bottom: none; padding-bottom: 0; margin-bottom: 0; }
  .card[open]{ background: transparent; border-bottom: none; }

<script>
const SUPABASE_URL = "https://huogkifyzaybppnhzayc.supabase.co";
const SUPABASE_KEY = "sb_publishable_IR37FVvE-vcguWs9RgATuw_WkvpUSu3";
const FORMSPREE_ENDPOINT = "https://formspree.io/f/myegvkqd";

const responses = {};      // podcast_id -> current status value
const notesText = {};      // podcast_id -> notes string
const deletedFlags = {};   // podcast_id -> boolean (removed from the list)
const statusHistory = {};  // podcast_id -> [{status, changed_at}, ...]
const scheduledDates = {}; // podcast_id -> ISO datetime string or null (recording date/time)
const detailsSent = {};    // podcast_id -> boolean (Slack reminder w/ call details sent to client)

async function fetchAllRows(){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/cahill_podcast_responses?select=podcast_id,response,notes,deleted,scheduled_at,details_sent`, {
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
  });
  if (!res.ok) throw new Error("fetch failed: " + res.status);
  return res.json();
}

async function fetchAllHistory(){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/cahill_status_log?select=podcast_id,status,changed_at&order=changed_at.asc`, {
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
  });
  if (!res.ok) throw new Error("fetch failed: " + res.status);
  return res.json();
}

function describeResponseValue(value){
  if (!value) return "(not set)";
  const opt = STATUS_OPTIONS.find(o => o.value === value);
  return opt ? opt.label : value;
}

async function notifyByEmail(podcastId, subjectSuffix, updateText){
  const podcast = PODCASTS.find(p => p.id === podcastId);
  const podcastName = podcast ? podcast.name : podcastId;
  try {
    await fetch(FORMSPREE_ENDPOINT, {
      method: "POST",
      headers: { "Content-Type": "application/json", "Accept": "application/json" },
      body: JSON.stringify({
        _subject: `Podcast pipeline ${subjectSuffix}: ${podcastName}`,
        podcast: podcastName,
        update: updateText
      })
    });
  } catch (e) {
    console.error("email notify failed", e);
  }
}

// Always writes the full known row (response + notes + deleted + scheduled_at) so a
// partial update never silently wipes out another field via Supabase's upsert behavior.
async function saveRow(id){
  const response = responses[id] ?? null;
  const notes = notesText[id] ?? null;
  const deleted = !!deletedFlags[id];
  const scheduled_at = scheduledDates[id] ?? null;
  const details_sent = !!detailsSent[id];
  await fetch(`${SUPABASE_URL}/rest/v1/cahill_podcast_responses`, {
    method: "POST",
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json",
      Prefer: "resolution=merge-duplicates"
    },
    body: JSON.stringify([{ podcast_id: id, response, notes, deleted, scheduled_at, details_sent, updated_at: new Date().toISOString() }])
  });
}

async function logStatusChange(id, status){
  await fetch(`${SUPABASE_URL}/rest/v1/cahill_status_log`, {
    method: "POST",
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json"
    },
    body: JSON.stringify([{ podcast_id: id, status }])
  });
}

async function saveResponse(id, value){
  responses[id] = value;
  await saveRow(id);
  if (value) await logStatusChange(id, value);
  notifyByEmail(id, "status update", describeResponseValue(value));
}

async function saveNotes(id, text){
  const trimmed = (text || "").trim();
  notesText[id] = trimmed || null;
  await saveRow(id);
  notifyByEmail(id, trimmed ? "note updated" : "note cleared", trimmed || "(note cleared)");
}

// Ordered progression of statuses you can mark on a podcast. `cls` reuses the
// existing done/action/precall/skip badge colors.
const STATUS_OPTIONS = [
  { value: "replied_to_host", label: "Replied to host", cls: "precall" },
  { value: "waiting_reply", label: "Waiting on reply", cls: "precall" },
  { value: "host_replied_need_response", label: "Host replied, need to respond", cls: "action" },
  { value: "need_form", label: "Need to fill out form", cls: "action" },
  { value: "form_filled", label: "Form filled out", cls: "precall" },
  { value: "need_precall", label: "Need to book pre-call", cls: "action" },
  { value: "precall_booked", label: "Pre-call booked", cls: "prebooked" },
  { value: "recording_booked", label: "Recording booked", cls: "done" },
  { value: "episode_recorded", label: "Episode recorded", cls: "done" }
];

const BOX_CLASS_BY_CLS = { done: "info-box", action: "action-box", precall: "precall-box", prebooked: "prebooked-box", skip: "skip-box" };

// Sort tier: 0 = needs a first action (nothing started, or a form/pre-call to
// book), 1 = in process (waiting on someone), 2 = pre-call booked, 3 = done.
// Unset status defaults to tier 0 since it also needs a first action.
const STATUS_PRIORITY = {
  need_form: 0, need_precall: 0,
  waiting_reply: 1, replied_to_host: 1, host_replied_need_response: 1, form_filled: 1,
  precall_booked: 2,
  recording_booked: 3,
  episode_recorded: 4
};

function lastChangedTime(id){
  const hist = statusHistory[id];
  if (!hist || !hist.length) return Date.now(); // never touched yet — treat as freshest
  return new Date(hist[hist.length - 1].changed_at).getTime();
}

const list = document.getElementById("list");

function fieldHTML(f){
  return `<div class="field">
    <div class="field-label">${f.label}</div>
    <div class="field-text">${f.text}</div>
  </div>`;
}

function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString("en-US", { day: "numeric", month: "short", year: "numeric" });
}

function fmtDateTime(iso){
  const d = new Date(iso);
  const datePart = d.toLocaleDateString("en-US", { day: "numeric", month: "short", year: "numeric" });
  const timePart = d.toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" });
  return `${datePart}, ${timePart}`;
}

// Converts an ISO datetime string to the value a <input type="date"> expects
// ("YYYY-MM-DD"), or "" if none set.
function isoToDateInputValue(iso){
  if (!iso) return "";
  const d = new Date(iso);
  const pad = n => String(n).padStart(2, "0");
  return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
}

// Splits an ISO datetime into 12-hour-clock parts for the hour/minute/AM-PM
// selects. Defaults to 9:00 AM when nothing is set yet, rather than "now".
function isoToTimeParts(iso){
  if (!iso) return { hour: 9, minute: "00", ampm: "AM" };
  const d = new Date(iso);
  let h = d.getHours();
  const ampm = h >= 12 ? "PM" : "AM";
  h = h % 12;
  if (h === 0) h = 12;
  const minute = d.getMinutes() < 30 ? "00" : "30";
  return { hour: h, minute, ampm };
}

const openCards = new Set();
let activeFilter = "all"; // "all" | "episode_recorded" | "recording_booked" | "waiting" | "action"

// Shared classification used by both the status chips and the list filter,
// so counts and filtering always agree with each other.
function classifyForChip(p){
  const r = responses[p.id];
  if (r === "episode_recorded") return "episode_recorded";
  if (r === "recording_booked") return "recording_booked";
  const meta = STATUS_OPTIONS.find(o => o.value === r);
  if (meta && (meta.cls === "precall" || meta.cls === "prebooked")) return "waiting";
  return "action"; // explicit "action" cls, or no status set yet
}

function render(){
  list.innerHTML = "";
  const visiblePodcasts = PODCASTS.filter(p => !deletedFlags[p.id] && (activeFilter === "all" || classifyForChip(p) === activeFilter));
  visiblePodcasts.sort((a, b) => {
    const pa = STATUS_PRIORITY[responses[a.id]] ?? 0;
    const pb = STATUS_PRIORITY[responses[b.id]] ?? 0;
    if (pa !== pb) return pa - pb;
    return lastChangedTime(b.id) - lastChangedTime(a.id); // freshest first within a tier
  });

  visiblePodcasts.forEach((p, idx) => {
    const resp = responses[p.id] || null;
    const statusMeta = STATUS_OPTIONS.find(o => o.value === resp) || null;
    const badgeCls = statusMeta ? statusMeta.cls : "skip";
    const scheduledAt = scheduledDates[p.id] || null;
    const showsSchedule = resp === "recording_booked" || resp === "episode_recorded" || resp === "precall_booked";
    const showsDetailsCheckbox = resp === "recording_booked" || resp === "precall_booked";
    const badgeLabel = statusMeta
      ? (showsSchedule && scheduledAt ? `${statusMeta.label} · ${fmtDateTime(scheduledAt)}` : statusMeta.label)
      : "Not set";

    const card = document.createElement("details");
    card.className = "card";
    card.dataset.id = p.id;
    if (openCards.has(p.id)) card.open = true;
    card.addEventListener("toggle", () => {
      if (card.open) openCards.add(p.id); else openCards.delete(p.id);
    });

    const boxClass = BOX_CLASS_BY_CLS[badgeCls] || "action-box";

    const linkHTML = p.link ? `<a class="btn primary" href="${p.link.url}" target="_blank">${p.link.label} →</a>` : "";

    const history = (statusHistory[p.id] || []).slice().reverse();
    const timelineHTML = history.length ? `
      <div class="divider"></div>
      <div class="response-header"><span class="response-title">Timeline</span></div>
      <div class="timeline">
        ${history.map(h => {
          const meta = STATUS_OPTIONS.find(o => o.value === h.status);
          return `<div class="timeline-item cls-${meta ? meta.cls : 'skip'}">
            <div class="timeline-label">${meta ? meta.label : h.status}</div>
            <div class="timeline-date">${fmtDate(h.changed_at)}</div>
          </div>`;
        }).join("")}
      </div>` : "";

    const existingNote = notesText[p.id] || "";
    const notesHTML = `
      <div class="divider"></div>
      <div class="response-header">
        <span class="response-title">Notes</span>
        ${existingNote ? `<button type="button" class="clear-response" data-clear-note-id="${p.id}">Delete</button>` : ""}
      </div>
      <div class="notes-block">
        <textarea class="notes-textarea" data-notes-id="${p.id}" placeholder="Add a note for the team (optional)...">${existingNote}</textarea>
        <div class="notes-footer">
          <button type="button" class="btn secondary btn-small" data-save-note-id="${p.id}" style="margin-top:0;" ${existingNote.trim() ? "" : "disabled"}>Save note</button>
          <span class="notes-status" data-notes-status="${p.id}"></span>
        </div>
      </div>`;

    card.innerHTML = `
      <summary>
        <img class="card-cover" src="${COVER_IMG}" alt="" />
        <div class="card-content">
          <div class="card-title-block">
            <p class="card-title">${p.name}</p>
            <p class="card-meta">${p.host}</p>
          </div>
          <span class="badge ${badgeCls}">${badgeLabel}</span>
        </div>
        <svg class="chev" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </summary>
      <div class="card-body">
        <div class="card-body-inner">
          ${fieldHTML({label:"Niche", text:p.niche})}
          ${p.fields.map(fieldHTML).join("")}
          <div class="${boxClass}">
            <div class="field-label">Context</div>
            <div class="field-text">${p.action}</div>
            ${linkHTML}
          </div>
          <div class="divider"></div>
          <div class="response-header"><span class="response-title">Status</span></div>
          <select class="status-select" data-status-id="${p.id}">
            <option value="" ${!resp ? "selected" : ""}>— select a status —</option>
            ${STATUS_OPTIONS.map(o => `<option value="${o.value}" ${resp===o.value ? "selected" : ""}>${o.label}</option>`).join("")}
          </select>
          ${showsSchedule ? (() => {
            const tp = isoToTimeParts(scheduledAt);
            const hourOptions = Array.from({length: 12}, (_, i) => i + 1)
              .map(h => `<option value="${h}" ${h === tp.hour ? "selected" : ""}>${h}</option>`).join("");
            const scheduleLabel = resp === "precall_booked" ? "Pre-call date &amp; time" : "Recording date &amp; time";
            return `
          <div class="schedule-row">
            <label class="schedule-label" for="schedule-date-${p.id}">${scheduleLabel}</label>
            <div class="schedule-fields">
              <input type="date" id="schedule-date-${p.id}" class="schedule-input schedule-date" data-schedule-part="date" data-schedule-id="${p.id}" value="${isoToDateInputValue(scheduledAt)}" />
              <select class="schedule-input schedule-hour" data-schedule-part="hour" data-schedule-id="${p.id}">${hourOptions}</select>
              <span class="schedule-colon">:</span>
              <select class="schedule-input schedule-minute" data-schedule-part="minute" data-schedule-id="${p.id}">
                <option value="00" ${tp.minute === "00" ? "selected" : ""}>00</option>
                <option value="30" ${tp.minute === "30" ? "selected" : ""}>30</option>
              </select>
              <select class="schedule-input schedule-ampm" data-schedule-part="ampm" data-schedule-id="${p.id}">
                <option value="AM" ${tp.ampm === "AM" ? "selected" : ""}>AM</option>
                <option value="PM" ${tp.ampm === "PM" ? "selected" : ""}>PM</option>
              </select>
            </div>
          </div>`;
          })() : ""}
          ${showsDetailsCheckbox ? `
          <label class="details-sent-row">
            <input type="checkbox" class="details-sent-checkbox" data-details-id="${p.id}" ${detailsSent[p.id] ? "checked" : ""} />
            <span>Sent call details to client (Slack)</span>
          </label>` : ""}
          ${timelineHTML}
          ${notesHTML}
          <div class="delete-row">
            <button type="button" class="delete-btn" data-delete-id="${p.id}" title="Remove from list">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
              <span>Delete podcast</span>
            </button>
          </div>
        </div>
      </div>
    `;
    list.appendChild(card);
  });

  document.querySelectorAll(".status-select").forEach(el => {
    el.addEventListener("click", (e) => e.stopPropagation());
    el.addEventListener("change", async (e) => {
      e.stopPropagation();
      const id = el.dataset.statusId;
      const val = el.value || null;
      responses[id] = val;
      if (val) {
        if (!statusHistory[id]) statusHistory[id] = [];
        statusHistory[id].push({ status: val, changed_at: new Date().toISOString() });
      }
      render();
      updateStatusChip();
      try { await saveResponse(id, val); } catch (err) { console.error("save error", err); }
    });
  });

  document.querySelectorAll(".schedule-input").forEach(el => {
    el.addEventListener("click", (e) => e.stopPropagation());
    el.addEventListener("change", async (e) => {
      e.stopPropagation();
      const id = el.dataset.scheduleId;
      const card = el.closest(".card-body-inner");
      const dateEl = card.querySelector(`[data-schedule-id="${id}"][data-schedule-part="date"]`);
      const hourEl = card.querySelector(`[data-schedule-id="${id}"][data-schedule-part="hour"]`);
      const minuteEl = card.querySelector(`[data-schedule-id="${id}"][data-schedule-part="minute"]`);
      const ampmEl = card.querySelector(`[data-schedule-id="${id}"][data-schedule-part="ampm"]`);
      const dateVal = dateEl.value; // "YYYY-MM-DD"
      if (!dateVal) {
        scheduledDates[id] = null;
      } else {
        let h = parseInt(hourEl.value, 10) % 12;
        if (ampmEl.value === "PM") h += 12;
        const [y, mo, da] = dateVal.split("-").map(Number);
        const d = new Date(y, mo - 1, da, h, parseInt(minuteEl.value, 10));
        scheduledDates[id] = d.toISOString();
      }
      render();
      try { await saveRow(id); } catch (err) { console.error("save error", err); }
    });
  });

  document.querySelectorAll(".details-sent-checkbox").forEach(el => {
    el.addEventListener("click", (e) => e.stopPropagation());
    el.addEventListener("change", async (e) => {
      e.stopPropagation();
      const id = el.dataset.detailsId;
      detailsSent[id] = el.checked;
      try { await saveRow(id); } catch (err) { console.error("save error", err); }
    });
  });

  document.querySelectorAll("[data-delete-id]").forEach(el => {
    el.addEventListener("click", async (e) => {
      e.preventDefault();
      e.stopPropagation();
      const id = el.dataset.deleteId;
      const podcast = PODCASTS.find(p => p.id === id);
      const ok = window.confirm(`Remove "${podcast ? podcast.name : id}" from the list? This can only be undone manually in the database.`);
      if (!ok) return;
      deletedFlags[id] = true;
      render();
      updateStatusChip();
      try { await saveRow(id); } catch (err) { console.error("delete error", err); }
    });
  });

  document.querySelectorAll(".clear-response[data-clear-note-id]").forEach(el => {
    el.addEventListener("click", async (e) => {
      e.preventDefault();
      e.stopPropagation();
      const id = el.dataset.clearNoteId;
      notesText[id] = null;
      render();
      try { await saveNotes(id, ""); } catch (err) { console.error("save error", err); }
    });
  });

  async function persistNote(id, value, statusEl){
    const previous = notesText[id] || "";
    if (value.trim() === previous.trim()) return;
    if (statusEl) statusEl.textContent = "Saving…";
    notesText[id] = value.trim() || null;
    try {
      await saveNotes(id, value);
      render();
      const freshStatusEl = document.querySelector(`[data-notes-status="${id}"]`);
      if (freshStatusEl) {
        freshStatusEl.textContent = "Saved";
        setTimeout(() => { freshStatusEl.textContent = ""; }, 1500);
      }
    } catch (err) {
      console.error("save error", err);
      if (statusEl) statusEl.textContent = "Failed to save";
    }
  }

  document.querySelectorAll(".notes-textarea").forEach(el => {
    el.addEventListener("click", (e) => e.stopPropagation());
    el.addEventListener("input", () => {
      const id = el.dataset.notesId;
      const saveBtn = document.querySelector(`[data-save-note-id="${id}"]`);
      if (saveBtn) saveBtn.disabled = el.value.trim().length === 0;
    });
    el.addEventListener("blur", () => {
      const id = el.dataset.notesId;
      const statusEl = document.querySelector(`[data-notes-status="${id}"]`);
      persistNote(id, el.value, statusEl);
    });
  });

  document.querySelectorAll("[data-save-note-id]").forEach(el => {
    el.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      const id = el.dataset.saveNoteId;
      const textarea = document.querySelector(`.notes-textarea[data-notes-id="${id}"]`);
      const statusEl = document.querySelector(`[data-notes-status="${id}"]`);
      if (textarea) persistNote(id, textarea.value, statusEl);
    });
  });

  renderSidebar();
}

// Right-hand "Upcoming" panel: every podcast with a scheduled date/time
// (pre-call, recording, or the date carried over to episode_recorded),
// grouped by day and sorted soonest-first — mirrors a calendar sidebar.
function renderSidebar(){
  const sidebarEl = document.getElementById("sidebarEvents");
  if (!sidebarEl) return;

  const startOfToday = new Date();
  startOfToday.setHours(0, 0, 0, 0);

  const events = PODCASTS
    .filter(p => !deletedFlags[p.id] && scheduledDates[p.id] && new Date(scheduledDates[p.id]) >= startOfToday)
    .map(p => {
      const resp = responses[p.id];
      const meta = STATUS_OPTIONS.find(o => o.value === resp);
      const showsDetails = resp === "precall_booked" || resp === "recording_booked";
      return { id: p.id, name: p.name, host: p.host, date: scheduledDates[p.id], cls: meta ? meta.cls : "skip", label: meta ? meta.label : "", showsDetails, detailsSent: !!detailsSent[p.id] };
    })
    .sort((a, b) => new Date(a.date) - new Date(b.date));

  if (!events.length) {
    sidebarEl.innerHTML = `<div class="sidebar-empty">No calls or recordings scheduled yet.</div>`;
    return;
  }

  const groups = [];
  events.forEach(ev => {
    const dayKey = new Date(ev.date).toDateString();
    let group = groups.find(g => g.dayKey === dayKey);
    if (!group) {
      group = { dayKey, label: new Date(ev.date).toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" }), items: [] };
      groups.push(group);
    }
    group.items.push(ev);
  });

  sidebarEl.innerHTML = groups.map(g => `
    <div class="sidebar-date-group">
      <div class="sidebar-date-label">${g.label}</div>
      ${g.items.map(ev => `
        <button type="button" class="sidebar-event cls-${ev.cls}" data-jump-id="${ev.id}">
          <div class="sidebar-event-title">${ev.name}</div>
          <div class="sidebar-event-meta">${ev.label} · ${new Date(ev.date).toLocaleTimeString("en-US", { hour: "numeric", minute: "2-digit" })}</div>
          ${ev.showsDetails ? `<div class="sidebar-event-details ${ev.detailsSent ? "sent" : "not-sent"}">${ev.detailsSent ? "✓ Details sent to client" : "Details not sent to client"}</div>` : ""}
        </button>
      `).join("")}
    </div>
  `).join("");

  sidebarEl.querySelectorAll("[data-jump-id]").forEach(btn => {
    btn.addEventListener("click", (e) => {
      e.stopPropagation();
      const id = btn.dataset.jumpId;
      const card = document.querySelector(`.card[data-id="${id}"]`);
      if (!card) return;
      card.open = true;
      openCards.add(id);
      card.scrollIntoView({ behavior: "smooth", block: "center" });
    });
  });
}

function updateStatusChip(){
  let all = 0, recorded = 0, booked = 0, waiting = 0, action = 0;
  PODCASTS.forEach(p => {
    if (deletedFlags[p.id]) return;
    all++;
    const cat = classifyForChip(p);
    if (cat === "episode_recorded") recorded++;
    else if (cat === "recording_booked") booked++;
    else if (cat === "waiting") waiting++;
    else action++;
  });
  document.getElementById("statusChipAll").textContent = `All (${all})`;
  document.getElementById("statusChipRecorded").textContent = `Episode recorded (${recorded})`;
  document.getElementById("statusChipBooked").textContent = `Recording booked (${booked})`;
  document.getElementById("statusChipPrecall").textContent = `Waiting on reply (${waiting})`;
  document.getElementById("statusChipPending").textContent = `Need action (${action})`;

  document.querySelectorAll(".status-chip").forEach(chip => {
    chip.classList.toggle("active", chip.dataset.filter === activeFilter);
  });
}

document.querySelectorAll(".status-chip[data-filter]").forEach(chip => {
  chip.addEventListener("click", () => {
    activeFilter = chip.dataset.filter;
    render();
    updateStatusChip();
  });
});

// Collapse an open card on any click that isn't on its own summary (header) —
// this covers clicks fully outside the card, AND clicks inside the open card's
// body away from the header, so people don't have to scroll back up to close it.
// Clicks on interactive controls (status select, notes, save/clear buttons)
// already call stopPropagation in their own handlers, so they never reach here.
// Also skip closing if the click is the tail end of selecting text (e.g. to
// copy a field), so selecting text inside a card doesn't collapse it.
document.addEventListener("click", (e) => {
  const selection = window.getSelection();
  if (selection && selection.toString().length > 0) return;
  document.querySelectorAll(".card[open]").forEach(card => {
    const summary = card.querySelector(":scope > summary");
    if (summary && summary.contains(e.target)) return; // let native summary toggle handle itself
    card.open = false;
    if (card.dataset.id) openCards.delete(card.dataset.id);
  });
});

async function loadResponses(){
  try {
    const rows = await fetchAllRows();
    rows.forEach(row => {
      responses[row.podcast_id] = row.response;
      notesText[row.podcast_id] = row.notes;
      deletedFlags[row.podcast_id] = !!row.deleted;
      scheduledDates[row.podcast_id] = row.scheduled_at || null;
      detailsSent[row.podcast_id] = !!row.details_sent;
    });
    const historyRows = await fetchAllHistory();
    historyRows.forEach(row => {
      if (!statusHistory[row.podcast_id]) statusHistory[row.podcast_id] = [];
      statusHistory[row.podcast_id].push({ status: row.status, changed_at: row.changed_at });
    });
  } catch (e) {
    console.error("load error", e);
  }
  render();
  updateStatusChip();
}

// Fills today's date as plain text under the sidebar header — no icons/emoji.
(function setSidebarToday(){
  const now = new Date();
  const dateEl = document.getElementById("sidebarTodayDate");
  if (dateEl) dateEl.textContent = now.toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
})();

// Only show the sidebar's thin scrollbar while actively scrolling (it stays
// hidden the rest of the time via the .is-scrolling CSS class).
(function setupSidebarScrollbar(){
  const sidebarEl = document.getElementById("sidebar");
  if (!sidebarEl) return;
  let hideTimer = null;
  sidebarEl.addEventListener("scroll", () => {
    sidebarEl.classList.add("is-scrolling");
    clearTimeout(hideTimer);
    hideTimer = setTimeout(() => sidebarEl.classList.remove("is-scrolling"), 800);
  });
})();

loadResponses();
</script>
