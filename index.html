<style>
  @import url('https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap');

  :root{
    --bg: #ffffff;
    --panel: #ffffff;
    --panel-border: #e0e2e7;
    --heading: #0b0f14;
    --body: #151c25;
    --ink-dim: #676d77;
    --placeholder: #aeb2b7;
    --amber: #5068d4;
    --amber-hover: #435298;
    --amber-tint: #f2f3fc;
    --danger: #eb0000;

    --status-done-bg: #eafaf1;
    --status-done-fg: #1b8a5a;
    --status-done-border: #bee8d2;
    --status-action-bg: #fff6e8;
    --status-action-fg: #b8720a;
    --status-action-border: #f3dfb3;

    --status-precall-bg: #eef1fc;
    --status-precall-fg: #5068d4;
    --status-precall-border: #c7d0f5;
  }

  *{ box-sizing: border-box; }
  body{
    margin:0;
    background: var(--bg);
    color: var(--body);
    font-family: 'DM Sans', sans-serif;
    padding: 0 0 80px;
  }

  .site-header{
    position: sticky;
    top: 0;
    z-index: 100;
    background: #ffffff;
    border-bottom: 1px solid var(--panel-border);
  }
  .site-header-inner{
    max-width: 720px;
    margin: 0 auto;
    padding: 16px;
    display: flex;
    justify-content: center;
  }

  .wrap{ max-width: 720px; margin: 0 auto; padding: 48px 16px 0; }

  .header{ margin-bottom: 32px; }
  .eyebrow{
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    font-size: 13px;
    color: var(--amber);
  }
  h1{
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: clamp(30px, 5.5vw, 40px);
    line-height: 1.15;
    margin: 14px 0 10px;
    letter-spacing: -0.01em;
    color: var(--heading);
  }
  .sub{ color: var(--ink-dim); font-size: 15px; line-height: 1.5; max-width: none; font-weight: 400; }

  .status-chip-row{ display:flex; gap:10px; margin-top:20px; flex-wrap:wrap; }
  .status-chip{
    display:inline-flex;
    align-items:center;
    gap:8px;
    padding:8px 16px;
    border-radius:100px;
    font-family: 'DM Sans', sans-serif;
    font-weight:600;
    font-size:13.5px;
  }
  .status-chip.chip-done{ background: var(--status-done-bg); color: var(--status-done-fg); }
  .status-chip.chip-action{ background: var(--status-action-bg); color: var(--status-action-fg); }
  .status-chip.chip-precall{ background: var(--status-precall-bg); color: var(--status-precall-fg); }
  .status-chip .dot{
    width:6px;height:6px;border-radius:50%;
    background: currentColor;
  }

  .card{
    background: var(--panel);
    border: 1px solid var(--panel-border);
    border-radius: 12px;
    overflow: hidden;
    margin-bottom: 16px;
    transition: border-color .15s ease;
  }
  .card[open]{ border-color: var(--amber); }
  .card summary{
    list-style: none;
    cursor: pointer;
    padding: 24px;
    display: flex;
    align-items: center;
    gap: 14px;
  }
  .card summary::-webkit-details-marker{ display:none; }

  .card-content{
    flex: 1;
    min-width: 0;
    display: flex;
    align-items: center;
    gap: 14px;
  }

  .chev{
    width: 18px; height: 18px;
    flex: 0 0 auto;
    color: var(--ink-dim);
    transition: transform .15s ease;
  }
  .card[open] .chev{ transform: rotate(90deg); color: var(--amber); }

  .card-title-block{ flex:1; min-width:0; }
  .card-title{
    font-family: 'Inter', sans-serif;
    font-weight: 700;
    font-size: 20px;
    line-height: 1.2;
    margin: 0 0 2px;
    color: var(--heading);
    letter-spacing: -0.005em;
  }
  .card-meta{ font-size: 13px; color: var(--ink-dim); font-weight: 400; }

  .badge{
    flex: 0 0 auto;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 11.5px;
    padding: 5px 10px;
    border-radius: 100px;
    white-space: nowrap;
  }
  .badge.done{ background: var(--status-done-bg); color: var(--status-done-fg); }
  .badge.action{ background: var(--status-action-bg); color: var(--status-action-fg); }
  .badge.precall{ background: var(--status-precall-bg); color: var(--status-precall-fg); }
  .badge.skip{ background: #f1f1f5; color: #676d77; }

  .card-body{ padding: 0 24px 24px; border-top: 1px solid var(--panel-border); }
  .card-body-inner{ padding-top: 20px; }

  .field{ margin-bottom: 28px; }
  .field:last-of-type{ margin-bottom: 0; }
  .field-label{
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 16px;
    line-height: 1.3;
    color: var(--heading);
    margin-bottom: 8px;
    letter-spacing: -0.003em;
  }
  .field-text{
    font-family: 'DM Sans', sans-serif;
    font-weight: 400;
    font-size: 14px;
    line-height: 1.6;
    color: var(--body);
  }
  .field-text a{ color: var(--amber); text-decoration: none; border-bottom: 1.5px solid var(--amber); }
  .field-text a:hover{ color: var(--amber-hover); border-bottom-color: var(--amber-hover); }

  .info-box{
    background: var(--status-done-bg);
    border: 1px solid var(--status-done-border);
    border-radius: 10px;
    padding: 14px 16px;
    margin: 16px 0;
  }
  .info-box .field-label{
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    line-height: 1.4;
    color: var(--status-done-fg);
    margin-bottom: 6px;
  }
  .info-box .field-text{ color: #125c3b; font-size: 14.5px; line-height: 1.6; }

  .precall-box{
    background: #ffffff;
    border: 1px solid var(--status-precall-border);
    border-radius: 10px;
    padding: 14px 16px;
    margin: 16px 0;
  }
  .precall-box .field-label{
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    line-height: 1.4;
    color: var(--status-precall-fg);
    margin-bottom: 6px;
  }
  .precall-box .field-text{ color: var(--body); font-size: 14.5px; line-height: 1.6; }

  .skip-box{
    background: #f7f7f9;
    border: 1px solid #e3e4e9;
    border-radius: 10px;
    padding: 14px 16px;
    margin: 16px 0;
  }
  .skip-box .field-label{
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    line-height: 1.4;
    color: #676d77;
    margin-bottom: 6px;
  }
  .skip-box .field-text{ color: var(--body); font-size: 14.5px; line-height: 1.6; }

  .action-box{
    background: #ffffff;
    border: 1px solid var(--status-action-border);
    border-radius: 10px;
    padding: 14px 16px;
    margin: 16px 0;
  }
  .action-box .field-label{
    font-family: 'DM Sans', sans-serif;
    font-size: 11px;
    font-weight: 700;
    letter-spacing: 0.06em;
    text-transform: uppercase;
    line-height: 1.4;
    color: var(--status-action-fg);
    margin-bottom: 6px;
  }
  .action-box .field-text{ color: var(--body); font-size: 14.5px; line-height: 1.6; }
  .action-box.highlight{
    border-color: var(--status-action-fg);
    box-shadow: 0 0 0 3px rgba(184,114,10,0.12);
  }

  .btn{
    display: inline-flex;
    align-items: center;
    gap: 8px;
    font-family: 'DM Sans', sans-serif;
    font-weight: 600;
    font-size: 14px;
    padding: 10px 16px;
    border-radius: 9px;
    text-decoration: none;
    margin-top: 10px;
  }
  .btn.primary{ background: var(--amber); color: #ffffff; }
  .btn.primary:hover{ background: var(--amber-hover); }
  .btn.secondary{ background: #ffffff; color: var(--amber); border: 1.5px solid var(--amber); }
  .btn.secondary:hover{ background: var(--amber-tint); }
  .btn-small{ padding: 7px 14px; font-size: 12.5px; }
  .btn:disabled{ opacity: 0.4; cursor: not-allowed; pointer-events: none; }

  .step-list{ display: flex; flex-direction: column; gap: 12px; margin-top: 4px; }
  .step-list-item{ display: flex; align-items: center; gap: 12px; }
  .step-list-num{
    flex: 0 0 auto;
    width: 22px; height: 22px;
    border-radius: 50%;
    border: 1.5px solid var(--status-action-fg);
    color: var(--status-action-fg);
    font-family: 'DM Sans', sans-serif;
    font-weight: 700;
    font-size: 12px;
    display: flex; align-items: center; justify-content: center;
  }

  .divider{ height: 1px; background: var(--panel-border); margin: 24px 0 20px; }

  .response-header{
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 12px;

const FORMSPREE_ENDPOINT = "https://formspree.io/f/myegvkqd";

const responses = {}; // podcast_id -> status value
const notesText = {}; // podcast_id -> notes string

async function fetchAllRows(){
  const res = await fetch(`${SUPABASE_URL}/rest/v1/podcast_responses?select=podcast_id,response,notes`, {
    headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
  });
  if (!res.ok) throw new Error("fetch failed: " + res.status);
  return res.json();
}

function describeResponseValue(podcast, value){
  if (!value) return "(cleared)";
  if (podcast.responseType === "checklist") {
    const set = value.split(",").filter(Boolean);
    if (!set.length) return "(cleared)";
    return set.map(v => {
      const opt = podcast.options.find(o => o.value === v);
      return opt ? opt.label.replace(/^[\u2713\u2715\u26a0]\s*/, "") : v;
    }).join(", ");
  }
  const opt = podcast.options.find(o => o.value === value);
  return opt ? opt.label.replace(/^[\u2713\u2715\u26a0]\s*/, "") : value;
}

async function notifyByEmail(podcastId, subjectSuffix, updateText){
  const podcast = PODCASTS.find(p => p.id === podcastId);
  const podcastName = podcast ? podcast.name : podcastId;
  try {
    await fetch(FORMSPREE_ENDPOINT, {
      method: "POST",

        _subject: `Podcast pipeline ${subjectSuffix}: ${podcastName}`,

        update: updateText
      })
    });
  } catch (e) {
    console.error("email notify failed", e);
  }
}

// Always writes the full known row (response + notes) so a partial update never

async function saveRow(id){
  const response = responses[id] ?? null;

  if (response === null && (!notes || !notes.trim())) {
    await fetch(`${SUPABASE_URL}/rest/v1/podcast_responses?podcast_id=eq.${id}`, {
      method: "DELETE",
      headers: { apikey: SUPABASE_KEY, Authorization: `Bearer ${SUPABASE_KEY}` }
    });
    return;
  }
  await fetch(`${SUPABASE_URL}/rest/v1/podcast_responses`, {
    method: "POST",
    headers: {
      apikey: SUPABASE_KEY,
      Authorization: `Bearer ${SUPABASE_KEY}`,
      "Content-Type": "application/json",
      Prefer: "resolution=merge-duplicates"
    },
    body: JSON.stringify([{ podcast_id: id, response, notes, updated_at: new Date().toISOString() }])
  });
}

async function saveResponse(id, value){
  responses[id] = value;
  const podcast = PODCASTS.find(p => p.id === id);
  await saveRow(id);
  notifyByEmail(id, "update", podcast ? describeResponseValue(podcast, value) : (value || "(cleared)"));
}

  const trimmed = (text || "").trim();
  notesText[id] = trimmed || null;

  notifyByEmail(id, trimmed ? "note updated" : "note cleared", trimmed || "(note cleared)");
}

const BADGE_CLS = {
  confirmed: "done", recording_booked: "done", done: "done",
  booked: "precall", precall_booked: "precall",
  reminder: "action", pending: "action", action: "action",
  skip: "skip", not_interested: "skip"
};

const BADGE_CLS_CHECKLIST = {
  questionnaire: "done", call: "done", later: "action", skip: "skip"
};

const list = document.getElementById("list");

function fieldHTML(f){
  return `<div class="field">
    <div class="field-label">${f.label}</div>
    <div class="field-text">${f.text}</div>
  </div>`;
}

const openCards = new Set();

function render(){
  list.innerHTML = "";
  PODCASTS.forEach((p, idx) => {
    const resp = responses[p.id] || null; // "choice": single value string. "checklist": comma-joined string
    const selectedSet = p.responseType === "checklist" ? new Set((resp || "").split(",").filter(Boolean)) : null;
    const card = document.createElement("details");
    card.className = "card";
    if (openCards.has(p.id)) card.open = true;
    card.addEventListener("toggle", () => {
      if (card.open) openCards.add(p.id); else openCards.delete(p.id);
    });

    let badgeCls, badgeLabel;
    if (p.responseType === "locked") {
      badgeCls = "done";
      badgeLabel = p.lockedStatus.label;
    } else if (p.responseType === "checklist") {
      if (selectedSet.has("skip")) { badgeCls = "skip"; badgeLabel = "Not interested"; }
      else if (selectedSet.has("questionnaire") && selectedSet.has("call")) { badgeCls = "done"; badgeLabel = "Fully booked"; }
      else if (selectedSet.size > 0) { badgeCls = "action"; badgeLabel = "In progress"; }
      else { badgeCls = "action"; badgeLabel = "Awaiting your response"; }
    } else {
      const chosen = p.options.find(o => o.value === resp);
      badgeCls = chosen ? BADGE_CLS[resp] : "action";
      badgeLabel = chosen ? chosen.label.replace(/^[\u2713\u2715\u26a0]\s*/, "") : "Awaiting your response";
    }

    const isResolved = p.responseType === "locked"
      ? true
      : p.responseType === "checklist"
        ? (selectedSet.has("skip") || (selectedSet.has("questionnaire") && selectedSet.has("call")))
        : !!resp;

    const hostFirstName = (p.host || "").split(/\s|·/)[0] || "the host";

    let boxClass, boxTitle, boxText, showLinks;

    if (p.responseType === "locked") {
      boxClass = "info-box";
      boxTitle = "Status";
      boxText = p.action;
      showLinks = false;
    } else if (p.responseType === "checklist") {
      if (selectedSet.has("skip")) {
        boxClass = "skip-box"; boxTitle = "Status";
        boxText = "Marked as not interested — no further action needed.";
        showLinks = false;
      } else if (selectedSet.has("questionnaire") && selectedSet.has("call")) {
        boxClass = "info-box"; boxTitle = "Status";
        boxText = "You're all set — the questionnaire is in and the recording is booked. No action needed.";
        showLinks = false;
      } else {
        boxClass = p.highlightMissing ? "action-box highlight" : "action-box";
        boxTitle = "What we need from you";
        boxText = p.action;
        showLinks = true;
      }
    } else {
      const respCls = resp ? BADGE_CLS[resp] : null;
      if (respCls === "done") {
        boxClass = "info-box"; boxTitle = "Status";
        boxText = p.doneNote || "You're all set — the recording is booked. No action needed on your end.";
        showLinks = false;
      } else if (respCls === "precall") {
        boxClass = "precall-box"; boxTitle = "Status";
        boxText = p.precallNote || `You've booked a pre-call with ${hostFirstName} — nice. Once you land on a recording date, come back and mark "Booked recording."`;
        showLinks = false;
      } else if (respCls === "skip") {
        boxClass = "skip-box"; boxTitle = "Status";
        boxText = "Marked as not interested — no further action needed.";
        showLinks = false;
      } else {
        boxClass = p.highlightMissing ? "action-box highlight" : "action-box";
        boxTitle = "What we need from you";
        boxText = p.action;
        showLinks = true;
      }
    }

    const linkList = p.links ? p.links : (p.link ? [p.link] : []);
    let linksHTML = "";
    if (showLinks && linkList.length > 1) {
      linksHTML = `<div class="step-list">` + linkList.map((l, i) => `
        <div class="step-list-item">
          <span class="step-list-num">${i+1}</span>
          <a class="btn ${i===0 ? 'primary' : 'secondary'}" href="${l.url}" target="_blank" style="margin-top:0;">${l.label} \u2192</a>
        </div>`).join("") + `</div>`;
    } else if (showLinks && linkList.length === 1) {
      linksHTML = `<a class="btn primary" href="${linkList[0].url}" target="_blank">${linkList[0].label} \u2192</a>`;
    }

    let responseRowHTML = "";
    if (p.responseType === "choice") {
      responseRowHTML = `
        <div class="divider"></div>
        <div class="response-header">
          <span class="response-title">Your response</span>
          ${resp ? `<button type="button" class="clear-response" data-clear-id="${p.id}">Clear</button>` : ""}
        </div>
        <div class="response-row">
          ${p.options.map(o => `<div class="choice ${resp===o.value ? 'active-'+BADGE_CLS[o.value] : ''}" data-mode="choice" data-id="${p.id}" data-val="${o.value}">${o.label}</div>`).join("")}
        </div>`;
    } else if (p.responseType === "checklist") {
      responseRowHTML = `
        <div class="divider"></div>
        <div class="response-header">
          <span class="response-title">Your response</span>
          ${selectedSet.size > 0 ? `<button type="button" class="clear-response" data-clear-id="${p.id}">Clear</button>` : ""}
        </div>
        <div class="response-row">
          ${p.options.map(o => `<div class="choice ${selectedSet.has(o.value) ? 'active-'+BADGE_CLS_CHECKLIST[o.value] : ''}" data-mode="checklist" data-id="${p.id}" data-val="${o.value}">${o.label}</div>`).join("")}
        </div>`;
    }

    const existingNote = notesText[p.id] || "";
    const notesHTML = `
      <div class="divider"></div>
      <div class="response-header">
        <span class="response-title">Notes</span>
        ${existingNote ? `<button type="button" class="clear-response" data-clear-note-id="${p.id}">Delete</button>` : ""}
      </div>
      <div class="notes-block">
        <textarea class="notes-textarea" data-notes-id="${p.id}" placeholder="Add a note for the team (optional)...">${existingNote}</textarea>
        <div class="notes-footer">
          <button type="button" class="btn secondary btn-small" data-save-note-id="${p.id}" style="margin-top:0;" ${existingNote.trim() ? "" : "disabled"}>Save note</button>
          <span class="notes-status" data-notes-status="${p.id}"></span>
        </div>
      </div>`;

    card.innerHTML = `
      <summary>
        <div class="card-content">
          <div class="card-title-block">
            <p class="card-title">${idx+1}. ${p.name}</p>
            <p class="card-meta">${p.host}</p>
          </div>
          <span class="badge ${badgeCls}">${badgeLabel}</span>
        </div>
        <svg class="chev" viewBox="0 0 24 24" fill="none"><path d="M9 6l6 6-6 6" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </summary>
      <div class="card-body">
        <div class="card-body-inner">
          ${fieldHTML({label:"Niche", text:p.niche})}
          ${p.fields.map(fieldHTML).join("")}
          <div class="${boxClass}">
            <div class="field-label">${boxTitle}</div>
            <div class="field-text">${boxText}</div>
            ${linksHTML}
          </div>
          ${responseRowHTML}
          ${notesHTML}
        </div>
      </div>
    `;
    list.appendChild(card);
  });

  document.querySelectorAll(".choice").forEach(el => {
    el.addEventListener("click", async (e) => {
      e.stopPropagation();
      const id = el.dataset.id;
      const val = el.dataset.val;
      const mode = el.dataset.mode;

      if (mode === "choice") {
        const current = responses[id];
        const next = current === val ? null : val;
        responses[id] = next;
        render();
        updateStatusChip();
        try { await saveResponse(id, next); } catch (err) { console.error("save error", err); }
      } else {
        const current = new Set((responses[id] || "").split(",").filter(Boolean));
        if (val === "skip") {
          if (current.has("skip")) { current.delete("skip"); } else { current.clear(); current.add("skip"); }
        } else {
          current.delete("skip");
          if (current.has(val)) { current.delete(val); } else { current.add(val); }
        }
        const next = Array.from(current).join(",") || null;
        responses[id] = next;
        render();
        updateStatusChip();
        try { await saveResponse(id, next); } catch (err) { console.error("save error", err); }
      }
    });
  });

  document.querySelectorAll(".clear-response[data-clear-id]").forEach(el => {
    el.addEventListener("click", async (e) => {
      e.preventDefault();
      e.stopPropagation();
      const id = el.dataset.clearId;
      responses[id] = null;
      render();
      updateStatusChip();
      try { await saveResponse(id, null); } catch (err) { console.error("save error", err); }
    });
  });

  document.querySelectorAll(".clear-response[data-clear-note-id]").forEach(el => {
    el.addEventListener("click", async (e) => {
      e.preventDefault();
      e.stopPropagation();
      const id = el.dataset.clearNoteId;
      notesText[id] = null;
      render();
      try { await saveNotes(id, ""); } catch (err) { console.error("save error", err); }
    });
  });

  async function persistNote(id, value, statusEl){
    const previous = notesText[id] || "";
    if (value.trim() === previous.trim()) return;
    if (statusEl) statusEl.textContent = "Saving…";
    notesText[id] = value.trim() || null;
    try {
      await saveNotes(id, value);
      render();
      const freshStatusEl = document.querySelector(`[data-notes-status="${id}"]`);
      if (freshStatusEl) {
        freshStatusEl.textContent = "Saved";
        setTimeout(() => { freshStatusEl.textContent = ""; }, 1500);
      }
    } catch (err) {
      console.error("save error", err);
      if (statusEl) statusEl.textContent = "Failed to save";
    }
  }

  document.querySelectorAll(".notes-textarea").forEach(el => {
    el.addEventListener("click", (e) => e.stopPropagation());
    el.addEventListener("input", () => {
      const id = el.dataset.notesId;
      const saveBtn = document.querySelector(`[data-save-note-id="${id}"]`);
      if (saveBtn) saveBtn.disabled = el.value.trim().length === 0;
    });
    el.addEventListener("blur", () => {
      const id = el.dataset.notesId;
      const statusEl = document.querySelector(`[data-notes-status="${id}"]`);
      persistNote(id, el.value, statusEl);
    });
  });

  document.querySelectorAll("[data-save-note-id]").forEach(el => {
    el.addEventListener("click", (e) => {
      e.preventDefault();
      e.stopPropagation();
      const id = el.dataset.saveNoteId;
      const textarea = document.querySelector(`.notes-textarea[data-notes-id="${id}"]`);
      const statusEl = document.querySelector(`[data-notes-status="${id}"]`);
      if (textarea) persistNote(id, textarea.value, statusEl);
    });
  });
}

function classifyPodcast(p){
  if (p.responseType === "locked") return "green";
  if (p.responseType === "checklist") {
    const set = new Set((responses[p.id] || "").split(",").filter(Boolean));
    if (set.has("skip")) return "excluded";
    if (set.has("questionnaire") && set.has("call")) return "green";
    return "amber";
  }
  const r = responses[p.id];
  const cls = BADGE_CLS[r];
  if (cls === "done") return "green";
  if (cls === "precall") return "blue";
  if (cls === "skip") return "excluded";
  return "amber";
}

function updateStatusChip(){
  let green = 0, blue = 0, amber = 0;
  PODCASTS.forEach(p => {
    const c = classifyPodcast(p);
    if (c === "green") green++;
    else if (c === "blue") blue++;
    else if (c === "amber") amber++;
  });
  document.getElementById("statusChipDone").textContent = `${green} Successful`;
  document.getElementById("statusChipPrecall").textContent = `${blue} Booked pre-call`;
  document.getElementById("statusChipPending").textContent = `${amber} Waiting your response`;
}

async function loadResponses(){
  try {
    const rows = await fetchAllRows();
    rows.forEach(row => {
      responses[row.podcast_id] = row.response;
      notesText[row.podcast_id] = row.notes;
    });
  } catch (e) {
    console.error("load error", e);
  }
  render();
  updateStatusChip();
}

loadResponses();
</script>
